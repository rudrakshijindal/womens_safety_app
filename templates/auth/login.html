{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="container auth-wrap">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card card-soft auth-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="feature-icon mx-auto"><i class="bi bi-box-arrow-in-right"></i></div>
            <h1 class="h3 mt-3 mb-1">Welcome back</h1>
            <p class="text-muted mb-0">Log in to your {{ app_name }} account.</p>
          </div>

          <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control form-control-lg" id="email" name="email"
                     value="{{ form.get('email', '') }}" autocomplete="email" required autofocus>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password"
                     autocomplete="current-password" required>
            </div>
            <button class="btn btn-rose btn-lg w-100" type="submit">Log in</button>
          </form>

          <p class="text-center text-muted mt-4 mb-0">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
          </p>
          {% if endpoint_exists('guardian.register') %}
            <p class="text-center small text-muted mt-2 mb-0">
              Want to help others? <a href="{{ url_for('guardian.register') }}">Apply as a guardian</a>
            </p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
