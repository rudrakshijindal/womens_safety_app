{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="error-code">{{ code }}</div>
  <h1 class="section-title">{{ title }}</h1>
  <p class="text-muted mx-auto" style="max-width:30rem">{{ message }}</p>
  <a class="btn btn-rose mt-3 px-4" href="{{ url_for('main.index') }}"><i class="bi bi-house me-2"></i>Back to home</a>
</div>
{% endblock %}
